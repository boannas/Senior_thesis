# ==================================================================================
# World configuration file
# ==================================================================================
simulation:
  dt: .1
  fps: 30   # Frames per second for rendering
  seed: 42  # Random seed for reproducibility

grid:
  width: 10
  height: 10  
  cell_px: 50

colors:
  bg:   [255, 255, 255]       
  grid: [220, 220, 220]    
  mother: [235, 87, 87]      
  child: [87, 87, 235]        
  food: [76, 175, 80]         
  threat: [200, 200, 200]      
  nest: [255, 193, 7]        
  outline: [120, 120, 120]    # [R, G, B] for entity outlines
# ==================================================================================





