# ==================================================================================
# World configuration file
# ==================================================================================
simulation:
  dt: 0.2
  fps: 30   # Frames per second for rendering
  seed: 42  # Random seed for reproducibility

grid:
  width: 5     
  height: 5  
  cell_px: 50

colors:
  bg:   [255, 255, 255]       
  grid: [220, 220, 220]    
  mother: [235, 87, 87]      
  child: [87, 87, 235]        
  food: [76, 175, 80]         
  threat: [200, 200, 200]      
  nest: [255, 193, 7]        
  outline: [120, 120, 120]    # [R, G, B] for entity outlines
# ==================================================================================





# ==================================================================================
# Entity parameters
# ==================================================================================
# Agent positions (Need to change in pygame_viewer.py to use this config)
mothers:
  starts: # initial position [x, y]
  - [7, 7]   
  - [9, 8]
  - [10, 2]

# Entity positions (Need to change in pygame_viewer.py to use this config)
food:
  positions:      # List of food positions
    - [3, 3]
    - [10, 3]
    - [3, 1]
    - [11, 11]
    - [3, 4]
    - [1, 3]
    - [8, 1]
    - [13, 11]
# ==================================================================================
