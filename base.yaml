# World configuration file

simulation:
  dt: 0.1

seed: 42    # Random seed for reproducibility
fps: 30   # Frames per second for rendering

grid:
  width: 15     
  height: 15  
  cell_px: 50 

# Agent positions
mothers:
  starts: # initial position [x, y]
  - [7, 7]   
  - [9, 8]
  - [10, 2]



# Entity positions
food:
  positions:      # List of food positions
    - [3, 3]
    - [10, 3]
    - [3, 1]
    - [11, 11]
    - [3, 4]
    - [1, 3]
    - [8, 1]
    - [13, 11]

colors:
  bg:   [255, 255, 255]       
  grid: [220, 220, 220]    
  mother: [235, 87, 87]      
  child: [87, 87, 235]        
  food: [76, 175, 80]         
  threat: [200, 200, 200]      
  nest: [255, 193, 7]        
  outline: [120, 120, 120]    # [R, G, B] for entity outlines
